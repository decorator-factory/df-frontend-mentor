<body>
  <article class="product-card">
    <picture>
      <source srcset="./images/image-product-desktop.jpg" media="(min-width: 1200px)">
      <img src="./images/image-product-mobile.jpg" alt="Photo of the perfume bottle">
    </picture>
    <div class="_info">

      <div class="_category">perfume</div>

      <h2>Gabrielle Essence Eau De Parfum</h2>

      <p class="_description">
        A floral, solar and voluptuous interpretation composed

      <div class="card-prices">

      <button class="btn" type="button">
        <img class="icon" src="./images/icon-cart.svg" alt="">

      </button>

    </div>
